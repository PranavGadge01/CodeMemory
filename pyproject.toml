[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "codememory"
version = "0.1.0"
description = "Local-first personal DSA knowledge engine"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "CodeMemory Developer"}
]
keywords = ["dsa", "leetcode", "knowledge-base", "duckdb", "parquet", "pydantic", "local-first"]
dependencies = [
    "pydantic>=2.0.0",
    "duckdb>=1.0.0",
    "polars>=1.0.0",
    "pyarrow>=14.0.0",
    "rich>=13.0.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.53.0",
    "python-dotenv>=1.0.0",
    "cryptography>=44.0.0",
    "keyring>=25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.28.1",
    "pyinstaller>=6.0",
    "fastapi"
]

[project.scripts]
codememory = "codememory.cli.main:main"
codememory-api = "api.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short -m 'not live'"
markers = [
    "live: integration tests that require live network access to leetcode.com. Excluded from the default selection so normal runs and CI need no network; run explicitly with `pytest -m live`.",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
